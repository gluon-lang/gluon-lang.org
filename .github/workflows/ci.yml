name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  RUST_BACKTRACE: "1"
  CROSS_VERSION: "0.2.5"

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2

      - name: Cache mdbook
        id: cache-mdbook
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/mdbook
          key: mdbook-${{ runner.os }}-0.5.4

      - name: Install mdbook
        if: steps.cache-mdbook.outputs.cache-hit != 'true'
        run: curl -fsSL https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C ~/.cargo/bin

      - name: Build Frontend
        run: npm ci && npm run build

      - name: Generate docs
        run: cargo run --bin generate_docs --all-features

      - name: Run CI script
        run: ./scripts/ci.sh
